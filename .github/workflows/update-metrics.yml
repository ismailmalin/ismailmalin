name: Update IXM Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '32 5 * * 1'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate verified GitHub stats and graphs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_metrics.py --username ismailmalin
      - name: Commit generated SVGs only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ixm-stats.svg assets/ixm-languages.svg assets/ixm-activity.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh IXM GitHub metrics'
            git push
          else
            echo 'No metrics changes to commit.'
          fi
